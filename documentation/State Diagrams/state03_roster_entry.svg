tLength="72.9258" x="646" y="477.292">Confirmed</text></g><g id="elem_GMN15"><path d="M6,155.2969 L6,210.6953 A0,0 0 0 0 6,210.6953 L243.4678,210.6953 A0,0 0 0 0 243.4678,210.6953 L243.4678,186.7969 L278.48,182.7969 L243.4678,178.7969 L243.4678,165.2969 L233.4678,155.2969 L6,155.2969 A0,0 0 0 0 6,155.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M233.4678,155.2969 L233.4678,165.2969 L243.4678,165.2969 L233.4678,155.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.7451" x="12" y="172.3638">Only exists for OPEN requests.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="176.5093" x="12" y="187.4966">A direct interest form skips</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.4678" x="12" y="202.6294">straight to AwaitingConfirmation.</text></g><g id="elem_GMN18"><path d="M572,570.2969 L572,625.6953 A0,0 0 0 0 572,625.6953 L792.8242,625.6953 A0,0 0 0 0 792.8242,625.6953 L792.8242,580.2969 L782.8242,570.2969 L686.5,570.2969 L682.5,509.4869 L678.5,570.2969 L572,570.2969 A0,0 0 0 0 572,570.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M782.8242,570.2969 L782.8242,580.2969 L792.8242,580.2969 L782.8242,570.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.7363" x="578" y="587.3638">Never reverts. The only way a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.8242" x="578" y="602.4966">Confirmed entry changes is an</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.793" x="578" y="617.6294">Admin deleting it outright.</text></g><!--link *start* to Volunteered--><g id="link_*star