<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1032px" preserveAspectRatio="none" style="width:992px;height:1032px;background:#FFFFFF;" version="1.1" viewBox="0 0 992 1032" width="992px" zoomAndPan="magnify"><title>6.11 Roster Confirmation Aggregation</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="301.5742" x="338.5029" y="22.9951">6.11 Roster Confirmation Aggregation</text><ellipse cx="234" cy="116.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M19.5,276.2969 L448.6196,276.2969 A12.5,12.5 0 0 1 461.1196,288.7969 L461.1196,301.4297 L7,301.4297 L7,288.7969 A12.5,12.5 0 0 1 19.5,276.2969 " fill="#D6EAF8" style="stroke:#D6EAF8;stroke-width:1.0;"/><rect fill="none" height="654.0625" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="454.1196" x="7" y="276.2969"/><line style="stroke:#555555;stroke-width:0.5;" x1="7" x2="461.1196" y1="301.4297" y2="301.4297"/><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="302.2881" x="82.9158" y="293.3638">Roster Confirmation (Team of n Ambassadors)</text><path d="M31.5,313.4297 L250.5972,313.4297 A12.5,12.5 0 0 1 263.0972,325.9297 L263.0972,338.5625 L19,338.5625 L19,325.9297 A12.5,12.5 0 0 1 31.5,313.4297 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="313.5313" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="244.0972" x="19" y="313.4297"/><line style="stroke:#555555;stroke-width:0.5;" x1="19" x2="263.0972" y1="338.5625" y2="338.5625"/><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="175.0874" x="53.5049" y="330.4966">Per-Member Roster Entries</text><path d="M43.5,350.5625 L241.5972,350.5625 A12.5,12.5 0 0 1 254.0972,363.0625 L254.0972,375.6953 L31,375.6953 L31,363.0625 A12.5,12.5 0 0 1 43.5,350.5625 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="266.3984" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="223.0972" x="31" y="350.5625"/><line style="stroke:#555555;stroke-width:0.5;" x1="31" x2="254.0972" y1="375.6953" y2="375.6953"/><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="150.4839" x="67.3066" y="367.6294">RosterEntry [i], i = 1..n</text><ellipse cx="117" cy="396.6953" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="RosterOpen.Members.Entry.Awaiting"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="136.8477" x="48.5" y="443.6953"/><line style="stroke:#555555;stroke-width:0.5;" x1="48.5" x2="185.3477" y1="468.8281" y2="468.8281"/><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="56.3037" x="88.772" y="460.7622">Awaiting</text><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="116.8477" x="53.5" y="485.895">Badge = Awaiting</text></g><g id="RosterOpen.Members.Entry.Confirmed"><rect fill="#D5F5E3" height="50.2656" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="148.2607" x="43" y="556.6953"/><line style="stroke:#555555;stroke-width:0.5;" x1="43" x2="191.2607" y1="581.8281" y2="581.8281"/><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="67.7168" x="83.272" y="573.7622">Confirmed</text><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="128.2607" x="48" y="598.895">Badge = Confirmed</text></g><!--link *start*Entry to Awaiting--><g id="link_*start*Entry_Awaiting"><path d="M117,406.8453 C117,416.1153 117,424.8353 117,437.4753 " fill="none" id="*start*Entry-to-Awaiting" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="117,443.4753,121,434.4753,117,438.4753,113,434.4753,117,443.4753" style="stroke:#181818;stroke-width:1.0;"/></g><!--link Awaiting to Confirmed--><g id="link_Awaiting_Confirmed"><path d="M117,493.7853 C117,512.3953 117,532.0553 117,550.6553 " fill="none" id="Awaiting-to-Confirmed" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="117,556.6553,121,547.6553,117,551.6553,113,547.6553,117,556.6553" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="126.0972" x="118" y="522.9058">Ambassador i confirms</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="117.9385" x="122.0793" y="535.7104">their own attendance</text></g><line style="stroke:#555555;stroke-width:1.5;stroke-dasharray:8.0,10.0;" x1="12" x2="454.1196" y1="631.9609" y2="631.9609"/><path d="M31.5,638.9609 L439.6196,638.9609 A12.5,12.5 0 0 1 452.1196,651.4609 L452.1196,664.0938 L19,664.0938 L19,651.4609 A12.5,12.5 0 0 1 31.5,638.9609 " fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1.0;"/><rect fill="none" height="281.3984" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="433.1196" x="19" y="638.9609"/><line style="stroke:#555555;stroke-width:0.5;" x1="19" x2="452.1196" y1="664.0938" y2="664.0938"/><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="159.9419" x="155.5889" y="656.0278">Aggregate Roster Status</text><g id="RosterOpen.CONC12.Aggregate.PartiallyConfirmed"><rect fill="#FDEBD0" height="65.3984" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="257.1675" x="31" y="732.0938"/><line style="stroke:#555555;stroke-width:0.5;" x1="31" x2="288.1675" y1="757.2266" y2="757.2266"/><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="120.4595" x="99.354" y="749.1606">PartiallyConfirmed</text><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="237.1675" x="36" y="774.2935">k = count(RosterEntry = Confirmed)</text><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="73.2456" x="36" y="789.4263">0 &lt;= k &lt; n</text></g><ellipse cx="159.5" cy="685.0938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="RosterOpen.CONC12.Aggregate.FullyConfirmed"><rect fill="#A9DFBF" height="50.2656" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="163.9839" x="77.5" y="860.0938"/><line style="stroke:#555555;stroke-width:0.5;" x1="77.5" x2="241.4839" y1="885.2266" y2="885.2266"/><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="98.3506" x="110.3167" y="877.1606">FullyConfirmed</text><text fill="#1B2631" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="143.9839" x="82.5" y="902.2935">Roster fully confirmed</text></g><!--link *start*Aggregate to PartiallyConfirmed--><g id="link_*start*Aggregate_PartiallyConfirmed"><path d="M159.5,695.2838 C159.5,704.3538 159.5,712.7238 159.5,725.9438 " fill="none" id="*start*Aggregate-to-PartiallyConfirmed" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="159.5,731.9438,163.5,722.9438,159.5,726.9438,155.5,722.9438,159.5,731.9438" style="stroke:#181818;stroke-width:1.0;"/></g><!--link PartiallyConfirmed to PartiallyConfirmed--><g id="link_PartiallyConfirmed_PartiallyConfirmed"><path d="M288.07,757.2738 C299.11,758.8338 306,761.2738 306,764.5938 C306,767.9137 305.051,769.5143 294.011,771.0743 " fill="none" id="PartiallyConfirmed-to-PartiallyConfirmed" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="288.07,771.9137,297.5411,774.6152,293.0208,771.2142,296.4218,766.6939,288.07,771.9137" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="88.6929" x="330.2134" y="755.8042">any RosterEntry</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="125.1196" x="312" y="768.6089">Awaiting -&gt; Confirmed</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="60.8438" x="344.1379" y="781.4136">(k still &lt; n)</text></g><!--link PartiallyConfirmed to FullyConfirmed--><g id="link_PartiallyConfirmed_FullyConfirmed"><path d="M159.5,797.3538 C159.5,816.9538 159.5,835.7238 159.5,853.7738 " fill="none" id="PartiallyConfirmed-to-FullyConfirmed" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="159.5,859.7738,163.5,850.7738,159.5,854.7738,155.5,850.7738,159.5,859.7738" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="38.7686" x="225.5789" y="826.3042">k == n</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="168.9263" x="160.5" y="839.1089">(every RosterEntry Confirmed)</text></g><ellipse cx="234" cy="1015.2969" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="234" cy="1015.2969" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_N0"><path d="M279,88.7969 L279,144.1953 L529.1567,144.1953 L529.1567,98.7969 L519.1567,88.7969 L279,88.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M519.1567,88.7969 L519.1567,98.7969 L529.1567,98.7969 L519.1567,88.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.1567" x="285" y="105.8638">Recomputed on every per-member</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.4644" x="285" y="120.9966">confirmation event; not a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.1631" x="285" y="136.1294">separate user action.</text></g><g id="elem_N1"><path d="M564.5,43.2969 L564.5,189.4922 L985.5801,189.4922 L985.5801,53.2969 L975.5801,43.2969 L564.5,43.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M975.5801,43.2969 L975.5801,53.2969 L985.5801,53.2969 L975.5801,43.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.2212" x="570.5" y="60.3638">The two regions above run concurrently: each RosterEntry</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.6533" x="570.5" y="75.4966">toggles independently (left), while the Aggregate region</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="381.6084" x="570.5" y="90.6294">(right) recomputes k after every toggle and only advances</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205.0864" x="570.5" y="105.7622">to FullyConfirmed once k == n.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="570.5" y="120.895">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.0801" x="570.5" y="136.0278">EngagementRoster always renders each member's individual</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.4092" x="570.5" y="151.1606">badge alongside the aggregate, so School / Organiser can</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="389.8159" x="570.5" y="166.2935">identify exactly which members remain Awaiting even after</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.4121" x="570.5" y="181.4263">the roster is fully confirmed.</text></g><!--link *start* to RosterOpen--><g id="link_*start*_RosterOpen"><path d="M234,126.5569 C234,148.5169 234,201.1669 234,270.0869 " fill="none" id="*start*-to-RosterOpen" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="234,276.0869,238,267.0869,234,271.0869,230,267.0869,234,276.0869" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="107.4595" x="236.5388" y="230.5073">Engagement status</text><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="110.5371" x="235" y="243.312">becomes Confirmed</text></g><!--link RosterOpen to *end*--><g id="link_RosterOpen_*end*"><path d="M234,930.3369 C234,963.8069 234,984.5669 234,998.2769 " fill="none" id="RosterOpen-to-*end*" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="234,1004.2769,238,995.2769,234,999.2769,230,995.2769,234,1004.2769" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="11" lengthAdjust="spacing" textLength="131.5166" x="235" y="971.5073">FullyConfirmed reached</text></g><!--SRC=[VLNVJnf147w_ls9I7mgDKAdHj1PDG21zgPhYc_Wmt0t7XhjTihj0gV5_x-pUmIqdQgAHdMzclldc1sOXv18rvZ35U95gjPB9hSgKXirSM8hCtcxccAYDa2dCC3EXPMpHqaX9UuSvmI_ArcH5ZCSGO_6Fe7CUc7fQgqrbwXmpVHmNNYA0_Y7xRdT9Cc6oDpTmCXeC-uEpOw1OoPdGEIKEDhWONGpFZy4mJJMbdCh3BeUzqVTZC4iw5n8pX-hz68pw8uTIEY5TI7fouN_urLLLldNwtoxFEz5h55bXCuBBTgS3VvJXQ71Ry4Chb8HUoOB_ZwAdBy_GQjsKm7kk5gvWA5DCAITfmR0oApEHKufLJcONYP8eCbwqJyTID1w9LLKpu6pv58tXbclJ_0Hemao7Yhn4N50Pz85qwpVbKmvSnXzAgmKP7wAm6D-mlKk1Sx0jF8ddKn1m3PrsMtgNuhrm0DXLtTkWiDpTyddtaINeOv8I1wWXzkK7a4gI0bFmgP07ur7Fv5Y4GIkvc7_fn_BREGaDQYC1hUM9H1cJ3_KQkL_-qse5ykrQJ3lrnhwDNedA5ihtWDeApB9jo7i_-r4esbkeDn-9S0KBrYVcqRQDi3s1PittVS-WUyq1kY3Vmnndmwuejn0adCXAxq3kYMmik7oHPIv9Cr1ZjAefKQtaHrngRhxyQv2SXzQa3oZL5NZZMZPkvjuX3fH-TIiUB95Bx5fpLO-X2UEvMrIf_7wu3LwkB5juGmj2Irwpt2_JHCRX0hDPsf_0de0JQSYTIGwoCam9OmTf-s6wEzk5V